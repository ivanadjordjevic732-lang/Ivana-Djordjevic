# Optionale Netlify-Konfiguration.
# Wenn du den fertigen dist-Ordner einfach per Drag-and-drop hochlädst,
# brauchst du diese Datei nicht. Sie hilft nur bei einem direkten Git-Deploy.
[build]
  base = "zahnarztpraxis-drews"
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
