<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindéa · Preisrechner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g:#8b6432; --gl:#b8904a; --green:#2e7d5e;
  --bg:#f1e4cf; --bc:#fdfaf5; --bi:#ffffff;
  --bd:rgba(139,100,50,.13); --gbg:rgba(139,100,50,.09); --gba:rgba(139,100,50,.15);
  --tc:#2c1f0e; --ts:#7a5c38; --tm:rgba(139,100,50,.45);
  --sh:0 2px 14px rgba(139,100,50,.09),0 1px 4px rgba(139,100,50,.06);
  --sm:0 4px 22px rgba(139,100,50,.13),0 2px 8px rgba(139,100,50,.07);
  --gg:linear-gradient(135deg,#8b6432,#b8904a);
  --cr:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tc);min-height:100vh;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding:28px 16px 48px}
.wrap{max-width:480px;margin:0 auto}
.card{background:var(--bc);border:1.5px solid var(--bd);border-radius:var(--cr);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--g);font-weight:700;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";width:22px;height:1.5px;background:var(--gg);display:inline-block}
h1{font-family:'Playfair Display',serif;font-size:27px;font-weight:700;line-height:1.22;letter-spacing:.3px}
.sub{font-size:13px;color:var(--ts);line-height:1.65;margin-top:10px}
.label{font-size:10px;color:var(--tm);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin:24px 0 10px}
.pakete{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.pkt{width:100%;text-align:left;cursor:pointer;border-radius:var(--cr);padding:14px 16px;transition:all .2s;
  background:var(--bc);border:1.5px solid var(--bd);box-shadow:var(--sh);font-family:inherit}
.pkt:hover{border-color:rgba(139,100,50,.3)}
.pkt.on{background:var(--gg);border-color:transparent;box-shadow:var(--sm)}
.pkt-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pkt-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--tc)}
.pkt-price{font-size:16px;font-weight:700;color:var(--g);white-space:nowrap}
.pkt-desc{font-size:11.5px;line-height:1.55;margin-top:5px;color:var(--ts)}
.pkt-days{font-size:10px;letter-spacing:.5px;margin-top:7px;color:var(--tm)}
.pkt.on .pkt-name{color:#fff}
.pkt.on .pkt-price{color:#fff}
.pkt.on .pkt-desc{color:rgba(255,255,255,.82)}
.pkt.on .pkt-days{color:rgba(255,255,255,.65)}
.section-lbl{font-size:10px;letter-spacing:1.5px;color:var(--tm);font-weight:600;text-transform:uppercase;margin-bottom:14px}
/* Skala */
.scale-track{position:relative;margin:2px 0}
.scale-line{position:absolute;top:7px;left:16%;right:16%;height:2px;background:var(--bd)}
.scale-row{position:relative;display:flex;justify-content:space-between}
.scale-step{flex:1;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;margin:0 auto 7px;background:var(--bc);border:2px solid var(--bd);transition:all .25s}
.scale-step.on .dot{background:var(--gg);border-color:transparent;box-shadow:0 0 0 4px var(--gba)}
.scale-cap{font-size:11px;font-weight:500;color:var(--tm);transition:all .25s}
.scale-step.on .scale-cap{font-weight:700;color:var(--g)}
/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--bc);border:1.5px solid var(--bd);border-radius:var(--cr);padding:14px 13px;box-shadow:var(--sh)}
.kpi.accent{border-color:rgba(46,125,94,.3)}
.kpi-lbl{font-size:9px;letter-spacing:1px;color:var(--tm);font-weight:600;text-transform:uppercase}
.kpi-val{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--tc);margin-top:5px;line-height:1}
.kpi.accent .kpi-val{color:var(--green)}
.kpi-sub{font-size:10px;color:var(--ts);margin-top:4px}
/* Balken */
.bar-row{margin-bottom:13px}
.bar-head{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px}
.bar-head .bl{color:var(--ts);font-weight:500}
.bar-track{height:13px;border-radius:7px;background:var(--gbg);overflow:hidden}
.bar-fill{height:100%;border-radius:7px;transition:width .45s ease}
.save-row{margin-top:6px;padding-top:13px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.save-lbl{font-size:12.5px;color:var(--tc);font-weight:600}
.save-val{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--green)}
/* Rechnung */
.calc{background:var(--gbg);border:1.5px solid transparent}
.calc-txt{font-size:11.5px;color:var(--ts);line-height:1.85}
.calc-txt strong{color:var(--tc)}
.calc-txt .pos{color:var(--green)}
/* Aufschlüsselung */
.brk-title{font-size:11px;font-weight:700;color:var(--tc);letter-spacing:1px;margin-bottom:8px}
.brk-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px}
.brk-row .bl{color:var(--ts)}
.brk-row .bv{color:var(--tc);font-weight:600}
.brk-row .je{color:var(--tm);font-weight:400;font-size:10px}
.brk-sum{display:flex;justify-content:space-between;padding:11px 0 4px;font-size:12px;font-weight:700}
.brk-sum .bv{color:var(--g)}
.brk-post{display:flex;justify-content:space-between;padding:9px 0 0;border-top:1px solid var(--bd);font-size:12px}
.note{margin:8px 4px 0;font-size:10.5px;color:var(--tm);line-height:1.75;font-style:italic}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Mindéa · Preisvergleich</div>
  <h1>Was kostet dein Werbespot wirklich?</h1>
  <p class="sub">Vergleiche ein Mindéa Paket mit einer klassischen Produktion pro Drehtag.</p>

  <div class="label">Wähle dein Mindéa Paket</div>
  <div class="pakete" id="pakete"></div>

  <div id="result"></div>

  <div class="card">
    <div class="brk-title">KLASSISCHER PRODUKTIONSTAG</div>
    <div id="breakdown"></div>
  </div>

  <p class="note">Die klassischen Produktionskosten sind Beispielwerte und können je nach Team, Location und Aufwand variieren.</p>

</div>

<script>
// Kosten einer klassischen Werbespot-Produktion (Beispielwerte, pro Drehtag)
const POSTEN = [
  {label:'Videograf',              val:900, je:'Tag'},
  {label:'Fotograf',               val:600, je:'Tag'},
  {label:'Assistenz',              val:300, je:'Tag'},
  {label:'Location',               val:500, je:'Tag'},
  {label:'Konzept & Regie',        val:700, je:'Tag'},
  {label:'Organisation & Styling', val:400, je:'Tag'},
];
const POST = 900; // Schnitt & Postproduktion, einmal pro Projekt
const TAGESSATZ = POSTEN.reduce((s,p)=>s+p.val,0); // 3.400 €/Tag
const PAKETE = {
  presence:{name:'Brand Presence', preis:398, tage:1, umfang:'1 kurzer cinematischer Werbespot · 10 Markenbilder'},
  story:   {name:'Brand Story',    preis:598, tage:2, umfang:'1 emotionaler Markenfilm mit Storytelling'},
  impact:  {name:'Brand Impact',   preis:998, tage:3, umfang:'1 größerer Werbespot mit stärkerer Markenwirkung'},
};
let sel = 'presence';
const fmtE = n => Math.round(n).toLocaleString('de-DE') + ' €';
const calc = key => {
  const p = PAKETE[key];
  const tageskosten = TAGESSATZ * p.tage;
  const klassisch = tageskosten + POST;
  return {p, tageskosten, klassisch, ersparnis: klassisch - p.preis};
};
function select(key){ sel = key; paintPakete(); paintResult(); }

function paintPakete(){
  document.getElementById('pakete').innerHTML = Object.keys(PAKETE).map(key=>{
    const p = PAKETE[key], on = key===sel;
    return '<button class="pkt'+(on?' on':'')+'" onclick="select(\''+key+'\')">'
      +'<div class="pkt-top"><span class="pkt-name">Mindéa '+p.name+'</span><span class="pkt-price">'+fmtE(p.preis)+'</span></div>'
      +'<div class="pkt-desc">'+p.umfang+'</div>'
      +'<div class="pkt-days">≈ '+p.tage+' Produktionstag'+(p.tage>1?'e':'')+' klassisch</div>'
      +'</button>';
  }).join('');
}

function paintResult(){
  const {p, tageskosten, klassisch, ersparnis} = calc(sel);
  const pctMindea = Math.max(6, Math.round(p.preis / klassisch * 100));

  const kpi = (lbl,val,sub,accent)=>
    '<div class="kpi'+(accent?' accent':'')+'"><div class="kpi-lbl">'+lbl+'</div>'
    +'<div class="kpi-val">'+val+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';

  const bar = (lbl,val,pct,fill,col)=>
    '<div class="bar-row"><div class="bar-head"><span class="bl">'+lbl+'</span>'
    +'<span style="color:'+col+';font-weight:700">'+val+'</span></div>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+fill+'"></div></div></div>';

  const scale = [1,2,3].map(t=>{
    const on = t===p.tage;
    return '<div class="scale-step'+(on?' on':'')+'"><div class="dot"></div>'
      +'<div class="scale-cap">'+t+' Tag'+(t>1?'e':'')+'</div></div>';
  }).join('');

  document.getElementById('result').innerHTML =
    '<div class="card">'
      +'<div class="section-lbl">Geschätzte klassische Produktionstage</div>'
      +'<div class="scale-track"><div class="scale-line"></div><div class="scale-row">'+scale+'</div></div>'
    +'</div>'
    +'<div class="kpis">'
      +kpi('Mindéa Preis', fmtE(p.preis), 'Fixpreis · '+p.name, false)
      +kpi('Klassische Tage', '≈ '+p.tage, fmtE(TAGESSATZ)+' / Tag', false)
      +kpi('Klassisch gesamt', fmtE(klassisch), p.tage+' Tag'+(p.tage>1?'e':'')+' + Post', false)
      +kpi('Deine Ersparnis', fmtE(ersparnis), 'gegenüber klassisch', true)
    +'</div>'
    +'<div class="card">'
      +'<div class="section-lbl">Vergleich</div>'
      +bar('Mindéa Fixpreis', fmtE(p.preis), pctMindea, 'var(--gg)', 'var(--g)')
      +bar('Klassische Produktion', fmtE(klassisch), 100, 'linear-gradient(135deg,#7a5c38,#9a7a52)', 'var(--tc)')
      +'<div class="save-row"><span class="save-lbl">Ersparnis durch Mindéa</span><span class="save-val">'+fmtE(ersparnis)+'</span></div>'
    +'</div>'
    +'<div class="card calc"><div class="calc-txt">'
      +'<strong>So rechnet sich das:</strong><br>'
      +p.tage+' × '+fmtE(TAGESSATZ)+' (Drehtag) = '+fmtE(tageskosten)+'<br>'
      +'+ '+fmtE(POST)+' (Schnitt & Postproduktion, einmalig)<br>'
      +'= '+fmtE(klassisch)+' klassische Produktion<br>'
      +'− '+fmtE(p.preis)+' Mindéa Fixpreis = <strong class="pos">'+fmtE(ersparnis)+' Ersparnis</strong>'
    +'</div></div>';
}

function paintBreakdown(){
  let rows = POSTEN.map(p=>
    '<div class="brk-row"><span class="bl">'+p.label+'</span>'
    +'<span class="bv">'+fmtE(p.val)+' <span class="je">/ '+p.je+'</span></span></div>'
  ).join('');
  document.getElementById('breakdown').innerHTML = rows
    +'<div class="brk-sum"><span>Tageskosten gesamt</span><span class="bv">'+fmtE(TAGESSATZ)+' / Tag</span></div>'
    +'<div class="brk-post"><span class="bl">Schnitt & Postproduktion</span>'
    +'<span class="bv">'+fmtE(POST)+' <span class="je">/ Projekt</span></span></div>';
}

paintPakete(); paintResult(); paintBreakdown();
</script>
</body>
</html>
