<div id="app">
  <div id="brand"><button class="brandmark" data-go="start" aria-label="Mindéa Creative Studio – Start">MINDÉA<small>Creative Studio</small></button></div>
  <header id="topbar">
    <div class="tb-wordmark" aria-hidden="true">MINDÉA<small>Creative Studio</small></div>
    <span class="view-label" id="view-label">Start</span>
    <input class="proj-name" id="proj-name" aria-label="Projektname" spellcheck="false" style="display:none">
    <div class="save-status" id="save-status" role="status" aria-live="polite"><span class="dot"></span><span class="txt">Lokal gespeichert</span></div>
    <div class="tb-spacer"></div>
    <div class="tb-group" id="tb-actions"></div>
  </header>
  <nav id="nav" aria-label="Hauptnavigation"></nav>
  <main id="main">
    <section class="view" id="view-start" aria-label="Start"></section>
    <section class="view" id="view-design" aria-label="Design Studio"></section>
    <section class="view" id="view-video" aria-label="Video Studio"></section>
    <section class="view" id="view-autoedit" aria-label="Auto Edit"></section>
    <section class="view" id="view-captions" aria-label="Captions"></section>
    <section class="view" id="view-carousel" aria-label="Karussell"></section>
    <section class="view" id="view-media" aria-label="Medien"></section>
    <section class="view" id="view-templates" aria-label="Vorlagen"></section>
    <section class="view" id="view-brand" aria-label="Brand Kit"></section>
    <section class="view" id="view-ai" aria-label="KI Studio"></section>
  </main>
  <nav id="bottomnav" aria-label="Navigation (mobil)"></nav>
</div>
<button class="btn primary" id="exit-preview" aria-label="Vorschau beenden">Vorschau beenden <span class="kbd">Esc</span></button>
<div id="toasts" aria-live="polite"></div>
<div id="tooltip" role="tooltip"></div>
<input type="file" id="file-any" multiple hidden accept="image/*,video/*,audio/*">
<noscript><p style="padding:40px;font-family:Georgia">Mindéa Creative Studio benötigt JavaScript.</p></noscript>
