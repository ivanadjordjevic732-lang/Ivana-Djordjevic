<style>
/* ═══════════════════════════════════════════════════════════════════════
   MINDÉA CREATIVE STUDIO — Design System
   Quiet Luxury · Editorial · Warm
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --c-black:#17130F; --c-espresso:#2A221A; --c-ivory:#F8F5F0; --c-cream:#F1E9DB;
  --c-sand:#D9CDB8; --c-gold:#B08D57; --c-lightgold:#D9C393; --c-white:#FFFFFF;

  --bg:#F8F5F0; --bg2:#F1E9DB; --surface:#FFFFFF; --surface2:#FBF8F3; --surface3:#F1E9DB;
  --line:rgba(23,19,15,.09); --line2:rgba(23,19,15,.16);
  --text:#17130F; --text2:#5E5347; --muted:#8C8072;
  --accent:#B08D57; --accent2:#8F6F3E; --accent-soft:rgba(176,141,87,.12); --accent-line:rgba(176,141,87,.45);
  --stage:#ECE5DA; --stage-dots:rgba(23,19,15,.05);
  --danger:#A1453A; --ok:#5E7A4E;
  --shadow-1:0 1px 2px rgba(23,19,15,.05),0 2px 8px rgba(23,19,15,.04);
  --shadow-2:0 8px 30px rgba(23,19,15,.10),0 2px 8px rgba(23,19,15,.05);
  --shadow-3:0 24px 64px rgba(23,19,15,.18),0 4px 16px rgba(23,19,15,.08);
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:24px;
  --f-serif:'Cormorant Garamond',Georgia,serif; --f-display:'Playfair Display',Georgia,serif; --f-sans:'Jost',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --nav-w:84px; --panel-w:304px; --insp-w:300px; --top-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17130F; --bg2:#1D1813; --surface:#211B15; --surface2:#1B1611; --surface3:#2A221A;
    --line:rgba(241,233,219,.08); --line2:rgba(241,233,219,.15);
    --text:#F1E9DB; --text2:#CBBFAE; --muted:#9A8C7B;
    --accent:#D9C393; --accent2:#E6D5AE; --accent-soft:rgba(217,195,147,.10); --accent-line:rgba(217,195,147,.42);
    --stage:#100D0A; --stage-dots:rgba(241,233,219,.04);
    --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 8px 30px rgba(0,0,0,.4); --shadow-3:0 24px 64px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17130F; --bg2:#1D1813; --surface:#211B15; --surface2:#1B1611; --surface3:#2A221A;
  --line:rgba(241,233,219,.08); --line2:rgba(241,233,219,.15);
  --text:#F1E9DB; --text2:#CBBFAE; --muted:#9A8C7B;
  --accent:#D9C393; --accent2:#E6D5AE; --accent-soft:rgba(217,195,147,.10); --accent-line:rgba(217,195,147,.42);
  --stage:#100D0A; --stage-dots:rgba(241,233,219,.04);
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 8px 30px rgba(0,0,0,.4); --shadow-3:0 24px 64px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px} svg.i.l{width:24px;height:24px}

/* ── App shell ─────────────────────────────────────────────────────────── */
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--nav-w) 1fr;grid-template-rows:var(--top-h) 1fr;grid-template-areas:"brand top" "nav main"}
#brand{grid-area:brand;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface2)}
.brandmark{font-family:var(--f-serif);font-weight:600;letter-spacing:.18em;font-size:15px;line-height:1;color:var(--text);text-align:center;background:none;border:0;padding:6px}
.brandmark small{display:block;font-family:var(--f-sans);font-size:7px;letter-spacing:.14em;white-space:nowrap;color:var(--accent);margin-top:5px;font-weight:500;text-transform:uppercase}
#topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:var(--surface2);min-width:0}
.tb-title{display:flex;flex-direction:column;min-width:0;gap:1px}
.tb-wordmark{display:none;font-family:var(--f-serif);font-size:18px;font-weight:600;letter-spacing:.2em;line-height:1}
.tb-wordmark small{font-family:var(--f-sans);font-size:9px;letter-spacing:.2em;color:var(--accent);margin-left:8px;font-weight:500;text-transform:uppercase}
.proj-name{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;font-family:var(--f-serif);font-size:19px;font-weight:600;min-width:60px;max-width:min(42vw,420px);text-overflow:ellipsis}
.proj-name:hover{border-color:var(--line)} .proj-name:focus{border-color:var(--accent-line);background:var(--surface)}
.view-label{font-family:var(--f-serif);font-size:20px;font-weight:600;padding:4px 8px}
.save-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap;padding:4px 8px;border-radius:20px}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.save-status.saving .dot{background:var(--accent);animation:pulse 1s infinite}
.save-status.error .dot{background:var(--danger)}
.tb-spacer{flex:1}
.tb-group{display:flex;align-items:center;gap:4px}
#nav{grid-area:nav;display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-right:1px solid var(--line);background:var(--surface2);overflow-y:auto}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border:0;background:transparent;border-radius:12px;color:var(--text2);font-size:10.5px;letter-spacing:.02em;transition:background .2s var(--ease),color .2s;min-height:54px}
.nav-btn:hover{background:var(--accent-soft);color:var(--text)}
.nav-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.nav-btn.active svg{color:var(--accent)}
.nav-sep{height:1px;background:var(--line);margin:6px 10px}
#main{grid-area:main;position:relative;overflow:hidden;min-width:0;min-height:0}
.view{position:absolute;inset:0;display:none;min-height:0}
.view.active{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#bottomnav{display:none}

/* ── Buttons & controls ────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;letter-spacing:.01em;transition:background .18s,border-color .18s,transform .1s,box-shadow .18s;white-space:nowrap;user-select:none}
.btn:hover{border-color:var(--accent-line);background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--c-black);border-color:var(--c-black);color:var(--c-ivory)}
.btn.primary:hover{background:var(--c-espresso)}
:root[data-theme="dark"] .btn.primary{background:var(--c-lightgold);border-color:var(--c-lightgold);color:var(--c-black)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--c-lightgold);border-color:var(--c-lightgold);color:var(--c-black)}}
.btn.gold{background:var(--c-gold);border-color:var(--c-gold);color:#fff}
.btn.gold:hover{background:#9c7a47}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--danger)} .btn.danger:hover{border-color:var(--danger)}
.btn.sm{min-height:32px;padding:0 11px;font-size:12px;border-radius:8px}
.btn.lg{min-height:48px;padding:0 22px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled],.ibtn[disabled]{opacity:.42;pointer-events:none}
.ibtn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--text2);transition:background .15s,color .15s;flex:none;position:relative}
.ibtn:hover{background:var(--accent-soft);color:var(--text)}
.ibtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.ibtn.bordered{border-color:var(--line2);background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);font-size:12.5px;color:var(--text2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent-line);color:var(--text)}
.chip.on{background:var(--c-black);border-color:var(--c-black);color:var(--c-ivory)}
:root[data-theme="dark"] .chip.on{background:var(--c-lightgold);border-color:var(--c-lightgold);color:var(--c-black)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--c-lightgold);border-color:var(--c-lightgold);color:var(--c-black)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;background:var(--surface3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12px;color:var(--text2);min-height:30px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label,.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.input,.select,.textarea{width:100%;min-height:40px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{min-height:110px;resize:vertical;line-height:1.55}
.input.sm,.select.sm{min-height:32px;padding:5px 9px;font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.serif{font-family:var(--f-serif)}
.hr{height:1px;background:var(--line);margin:14px 0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent2);font-weight:500;white-space:nowrap}
:root[data-theme="dark"] .badge{color:var(--accent)}
.badge.dark{background:var(--c-black);color:var(--c-ivory)}
.badge.warn{background:rgba(161,69,58,.1);color:var(--danger)}
.kbd{font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);font-family:var(--f-sans)}

/* range */
.range{display:grid;grid-template-columns:1fr 54px;align-items:center;gap:8px;margin-bottom:6px}
.range .rl{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.range .rl button{border:0;background:none;color:var(--muted);font-size:11px;padding:0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--line2)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent);margin-top:-7.5px;box-shadow:var(--shadow-1)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent)}
.num{width:54px;min-height:28px;padding:3px 4px;text-align:center;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px}
.color-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);flex:none;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.sw.none{background:linear-gradient(135deg,transparent 46%,var(--danger) 47%,var(--danger) 53%,transparent 54%),var(--surface)}
.colorpick{position:relative;width:28px;height:28px;border-radius:50%;overflow:hidden;border:1px dashed var(--line2);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.colorpick input{position:absolute;inset:-8px;opacity:0;cursor:pointer;width:50px;height:50px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;cursor:pointer;font-size:13px}
.toggle input{display:none}
.toggle .tg{width:36px;height:21px;border-radius:12px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.toggle .tg::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.tg{background:var(--c-gold)}
.toggle input:checked+.tg::after{transform:translateX(15px)}

/* ── Tooltip ───────────────────────────────────────────────────────────── */
#tooltip{position:fixed;z-index:9000;pointer-events:none;background:var(--c-black);color:var(--c-ivory);font-size:11.5px;padding:6px 9px;border-radius:7px;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;max-width:240px;box-shadow:var(--shadow-2)}
#tooltip.show{opacity:1;transform:none}
#tooltip .kbd{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.7);margin-left:6px}

/* ── Toasts ────────────────────────────────────────────────────────────── */
#toasts{position:fixed;z-index:9500;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;background:var(--c-black);color:var(--c-ivory);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow-3);font-size:13px;animation:toastIn .3s var(--ease);max-width:100%}
.toast .ti{color:var(--c-lightgold);margin-top:1px}
.toast.error .ti{color:#E6A196}
.toast .ta{margin-left:auto;color:var(--c-lightgold);background:none;border:0;font-weight:500;padding:0 0 0 8px;font-size:12.5px;white-space:nowrap}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
.spinner.lg{width:30px;height:30px}

/* ── Modal & sheets ────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:8000;background:rgba(23,19,15,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-3);width:min(520px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;animation:fadeUp .28s var(--ease);border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)} .modal.xwide{width:min(1120px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.modal-h h3{margin:0;font-family:var(--f-serif);font-size:24px;font-weight:600;letter-spacing:.01em;flex:1}
.modal-b{padding:8px 20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.menu{position:fixed;z-index:8500;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-3);padding:5px;min-width:190px;animation:fadeUp .16s var(--ease)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 11px;border-radius:8px;font-size:13px;text-align:left;min-height:40px}
.menu button:hover{background:var(--accent-soft)}
.menu button.danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}

/* ── Dashboard ─────────────────────────────────────────────────────────── */
.page{width:100%;max-width:1240px;margin:0 auto;padding:34px 34px 80px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:10px}
.h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(34px,4.4vw,54px);line-height:1.02;margin:0;letter-spacing:-.005em}
.h1 em{font-style:italic;color:var(--accent)}
.h2{font-family:var(--f-serif);font-weight:600;font-size:26px;margin:0}
.h3{font-family:var(--f-serif);font-weight:600;font-size:20px;margin:0}
.lead{color:var(--text2);font-size:15px;max-width:560px;margin:10px 0 0}
.feature-row{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:16px}
.feature{position:relative;overflow:hidden;border-radius:var(--r-l);padding:24px;min-height:178px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s;text-align:left}
.feature:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.feature.dark{background:linear-gradient(140deg,#17130F 0%,#2A221A 100%);color:var(--c-ivory);border-color:#2A221A}
.feature.dark .muted{color:rgba(241,233,219,.65)}
.feature .ft{font-family:var(--f-serif);font-size:28px;font-weight:500;line-height:1.08;margin:8px 0 6px;max-width:380px}
.feature .fdeco{position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;opacity:.22;pointer-events:none;color:var(--accent)}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:36px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);text-align:left;transition:all .2s var(--ease);min-height:108px}
.qa:hover{border-color:var(--accent-line);transform:translateY(-1px);box-shadow:var(--shadow-1)}
.qa .qi{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent2);display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .qa .qi{color:var(--accent)}
.qa b{font-weight:500;font-size:13.5px;display:block}
.qa span{font-size:11px;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 14px;gap:10px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden;cursor:pointer;transition:all .2s var(--ease);position:relative}
.pcard:hover{box-shadow:var(--shadow-2);transform:translateY(-2px)}
.pthumb{aspect-ratio:4/5;background:var(--surface3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pthumb img{width:100%;height:100%;object-fit:contain;background:var(--stage)}
.pthumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(23,19,15,.75);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:10px}
.pmeta{padding:10px 12px 12px;display:flex;gap:6px;align-items:flex-start}
.pmeta .pn{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta .ps{font-size:11px;color:var(--muted);margin-top:2px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;gap:10px;color:var(--text2);border:1px dashed var(--line2);border-radius:var(--r-l);background:var(--surface2)}
.empty .ei{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.empty h4{margin:0;font-family:var(--f-serif);font-size:22px;font-weight:600;color:var(--text)}
.empty p{margin:0;max-width:380px;font-size:13px}

/* ── Editor layout ─────────────────────────────────────────────────────── */
.editor{flex:1;display:grid;grid-template-columns:62px var(--panel-w) 1fr var(--insp-w);grid-template-rows:1fr auto;min-height:0;min-width:0}
.editor.panel-closed{grid-template-columns:62px 0 1fr var(--insp-w)}
.toolrail{grid-row:1/3;display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-right:1px solid var(--line);background:var(--surface2);overflow-y:auto}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:0;background:transparent;border-radius:10px;color:var(--text2);font-size:9.5px;min-height:52px}
.tool-btn:hover{background:var(--accent-soft);color:var(--text)}
.tool-btn.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.tool-btn.on svg{color:var(--accent)}
.toolpanel{grid-row:1/3;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.editor.panel-closed .toolpanel{display:none}
.tp-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;gap:8px}
.tp-h h4{margin:0;font-family:var(--f-serif);font-size:21px;font-weight:600}
.tp-b{flex:1;overflow-y:auto;padding:4px 14px 20px;-webkit-overflow-scrolling:touch}
.stagewrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--stage)}
.stage{flex:1;position:relative;overflow:auto;min-height:0;background-image:radial-gradient(var(--stage-dots) 1px,transparent 1px);background-size:18px 18px;touch-action:none}
.stage-inner{position:relative;margin:auto}
.canvas-holder{position:absolute;box-shadow:var(--shadow-3);background:#fff}
.canvas-holder canvas{display:block;width:100%;height:100%}
.inspector{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.ins-sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.ins-sec h5{margin:0 0 10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:space-between}
.ins-title{padding:14px 16px 4px;display:flex;align-items:center;gap:8px}
.ins-title h4{margin:0;font-family:var(--f-serif);font-size:21px;font-weight:600;flex:1}
.stage-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--line);background:var(--surface2);flex-wrap:nowrap;overflow-x:auto}
.zoomlbl{font-size:12px;color:var(--muted);min-width:44px;text-align:center}
.pages{grid-column:3/4;border-top:1px solid var(--line);background:var(--surface2);display:flex;gap:10px;padding:10px 12px;overflow-x:auto;align-items:center;-webkit-overflow-scrolling:touch}
.pg{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
.pg canvas{border-radius:6px;box-shadow:var(--shadow-1);border:2px solid transparent;background:#fff;display:block}
.pg.on canvas{border-color:var(--accent)}
.pg span{font-size:10.5px;color:var(--muted);max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-add{flex:none;width:56px;height:70px;border-radius:8px;border:1.5px dashed var(--line2);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pg-add:hover{border-color:var(--accent);color:var(--accent)}

/* selection overlay */
.selbox{position:absolute;border:1.5px solid var(--c-gold);pointer-events:none;transform-origin:center center}
.selbox.locked{border-style:dashed}
.selbox .hd{position:absolute;width:14px;height:14px;background:#fff;border:1.5px solid var(--c-gold);border-radius:50%;pointer-events:auto;touch-action:none}
.selbox .hd::after{content:"";position:absolute;inset:-10px}
.selbox .hd.nw{left:-8px;top:-8px;cursor:nwse-resize}.selbox .hd.ne{right:-8px;top:-8px;cursor:nesw-resize}
.selbox .hd.sw{left:-8px;bottom:-8px;cursor:nesw-resize}.selbox .hd.se{right:-8px;bottom:-8px;cursor:nwse-resize}
.selbox .hd.n{left:calc(50% - 7px);top:-8px;cursor:ns-resize;border-radius:4px;width:14px;height:8px;top:-5px}
.selbox .hd.s{left:calc(50% - 7px);bottom:-5px;cursor:ns-resize;border-radius:4px;width:14px;height:8px}
.selbox .hd.w{top:calc(50% - 7px);left:-5px;cursor:ew-resize;border-radius:4px;width:8px;height:14px}
.selbox .hd.e{top:calc(50% - 7px);right:-5px;cursor:ew-resize;border-radius:4px;width:8px;height:14px}
.selbox .hd.rot{left:calc(50% - 9px);top:-38px;width:18px;height:18px;cursor:grab;background:var(--c-gold);border-color:#fff}
.selbox .rotline{position:absolute;left:50%;top:-22px;height:20px;border-left:1.5px solid var(--c-gold)}
.selbox .lockbadge{position:absolute;right:-10px;top:-26px;background:var(--c-gold);color:#fff;border-radius:10px;padding:2px 6px;font-size:10px}
.hoverbox{position:absolute;border:1px solid var(--accent-line);pointer-events:none}
.guide{position:absolute;background:#E0457B;pointer-events:none;z-index:5}
.guide.v{width:1px;top:0;bottom:0}.guide.h{height:1px;left:0;right:0}
.safezone{position:absolute;inset:0;pointer-events:none}
.safezone .sz{position:absolute;background:rgba(224,69,123,.05);border:1px dashed rgba(224,69,123,.4)}
.safezone .szl{position:absolute;font-size:10px;color:rgba(224,69,123,.9);padding:3px 6px;font-weight:500;letter-spacing:.05em}
.textedit{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed var(--c-gold);background:rgba(255,255,255,.04);resize:none;overflow:hidden;white-space:pre-wrap;z-index:6;transform-origin:center center}
.croppad{position:absolute;pointer-events:none;outline:2px solid var(--c-gold);box-shadow:0 0 0 4000px rgba(23,19,15,.35)}

/* lists in panels */
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile-grid.three{grid-template-columns:repeat(3,1fr)}
.tile{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;transition:all .15s;position:relative;display:flex;align-items:center;justify-content:center;min-height:64px;color:var(--text)}
.tile:hover{border-color:var(--accent-line);box-shadow:var(--shadow-1)}
.tile img,.tile canvas{display:block;width:100%;height:100%;object-fit:cover}
.tile .tl{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 5px;font-size:10.5px;background:linear-gradient(transparent,rgba(23,19,15,.6));color:#fff;text-align:left}
.tile.sq{aspect-ratio:1}
.tile.tall{aspect-ratio:4/5}
.tile .fav{position:absolute;top:5px;right:5px;color:var(--c-lightgold)}
.tile .kind{position:absolute;top:5px;left:5px;background:rgba(23,19,15,.6);color:#fff;font-size:9.5px;padding:2px 6px;border-radius:8px;display:flex;align-items:center;gap:3px}
.tile.sel{outline:2.5px solid var(--c-gold);outline-offset:-2.5px}
.addtext{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:all .15s}
.addtext:hover{border-color:var(--accent-line)}
.layer{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 8px;border-radius:9px;border:1px solid transparent;margin-bottom:3px;background:var(--surface2);min-height:44px;touch-action:none}
.layer.on{border-color:var(--accent-line);background:var(--accent-soft)}
.layer.dragging{opacity:.5}
.layer.dropabove{box-shadow:0 -2px 0 var(--c-gold)} .layer.dropbelow{box-shadow:0 2px 0 var(--c-gold)}
.layer .lname{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .lic{width:26px;height:26px;border-radius:6px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.layer .ibtn{width:32px;height:32px}
.layer .grip{cursor:grab;color:var(--muted);display:flex;padding:4px}

/* ── Video editor ──────────────────────────────────────────────────────── */
.veditor{flex:1;display:grid;grid-template-columns:1fr var(--insp-w);grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.vtop{display:grid;grid-template-columns:62px 1fr;grid-template-rows:minmax(0,1fr);min-height:0}
.vtop .toolrail{grid-row:1}
.vpreview{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--stage)}
.vstage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:14px}
.vcanvas-wrap{position:relative;box-shadow:var(--shadow-3);background:#000;touch-action:none}
.vcanvas-wrap canvas{display:block;width:100%;height:100%}
.vcontrols{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px 8px}
.tc{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--text2);min-width:108px;text-align:center}
.play-btn{width:46px;height:46px;border-radius:50%;background:var(--c-black);color:var(--c-ivory);border:0;display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .play-btn{background:var(--c-lightgold);color:var(--c-black)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .play-btn{background:var(--c-lightgold);color:var(--c-black)}}
.vinspector{grid-row:1/3;grid-column:2}
.timeline{grid-column:1/2;border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;height:var(--tl-h,326px);min-height:180px;position:relative}
.tl-resize{position:absolute;top:-5px;left:0;right:0;height:10px;cursor:ns-resize;z-index:3}
.tl-bar{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tl-bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.tl-body{flex:1;display:grid;grid-template-columns:96px 1fr;min-height:0;overflow:hidden}
.tl-labels{border-right:1px solid var(--line);background:var(--surface2);overflow:hidden;position:relative}
.tl-labels-inner{position:absolute;left:0;right:0;top:0}
.tl-label{height:var(--trk-h,34px);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.tl-label.ruler{height:26px}
.tl-scroll{overflow:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.tl-content{position:relative;min-height:100%}
.tl-ruler{height:26px;position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);cursor:pointer;touch-action:none}
.tl-ruler canvas{position:absolute;left:0;top:0;height:26px}
.tl-track{height:var(--trk-h,34px);position:relative;border-bottom:1px solid var(--line)}
.tl-track.main{background:var(--surface2)}
.tl-item{position:absolute;top:3px;bottom:3px;border-radius:7px;overflow:hidden;cursor:pointer;font-size:10.5px;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);user-select:none;-webkit-user-select:none}
.tl-item .tn{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tl-item.video{background:#3A3027 repeat-x;background-size:auto 100%}
.tl-item.video::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(23,19,15,.35),rgba(23,19,15,.15))}
.tl-item.image{background:#4a3d31 repeat-x;background-size:auto 100%}
.tl-item.image::before{content:"";position:absolute;inset:0;background:rgba(23,19,15,.3)}
.tl-item.broll{background:#6E5A44 repeat-x;background-size:auto 100%}
.tl-item.broll::before{content:"";position:absolute;inset:0;background:rgba(80,62,40,.45)}
.tl-item.overlay{background:#857055}
.tl-item.graphics{background:#B08D57}
.tl-item.text{background:#2A221A}
.tl-item.caption{background:#D9CDB8;color:#17130F}
.tl-item.caption .tn{text-shadow:none}
.tl-item.audio{background:#5F6B57}
.tl-item.voice{background:#7A5F4E}
.tl-item canvas.wave{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.tl-item.sel{outline:2px solid var(--c-lightgold);outline-offset:1px;z-index:2;touch-action:none}
.tl-item.disabled{opacity:.45}
.tl-item .th{position:absolute;top:0;bottom:0;width:12px;z-index:2;cursor:ew-resize;display:none;touch-action:none}
.tl-item.sel .th{display:block;background:rgba(217,195,147,.85)}
.tl-item .th.l{left:0;border-radius:6px 0 0 6px}.tl-item .th.r{right:0;border-radius:0 6px 6px 0}
.tl-item .th::after{content:"";position:absolute;top:30%;bottom:30%;left:5px;border-left:1.5px solid rgba(23,19,15,.6)}
.tl-trans{position:absolute;top:10px;width:18px;height:18px;margin-left:-9px;border-radius:5px;background:var(--surface);border:1px solid var(--accent);color:var(--accent);z-index:3;display:flex;align-items:center;justify-content:center;padding:0}
.tl-playhead{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--c-gold);z-index:6;pointer-events:none}
.tl-playhead::before{content:"";position:absolute;top:0;left:-8px;width:14px;height:16px;background:var(--c-gold);clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);pointer-events:auto;cursor:ew-resize}
.tl-snap{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #E0457B;z-index:5;pointer-events:none}
.vctx{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:none;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow-2);z-index:7}

/* auto edit / wizard */
.ae-wrap{width:100%;max-width:1100px;margin:0 auto;padding:30px 30px 80px}
.drop{border:1.5px dashed var(--accent-line);border-radius:var(--r-xl);background:var(--surface);padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;transition:all .2s}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.card h4{margin:0 0 4px;font-family:var(--f-serif);font-size:20px;font-weight:600}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;background:var(--surface);transition:all .15s;min-height:66px}
.opt:hover{border-color:var(--accent-line)}
.opt.on{border-color:var(--c-gold);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--c-gold)}
.opt b{display:block;font-weight:500;font-size:13.5px;margin-bottom:3px}
.opt span{font-size:11.5px;color:var(--muted);line-height:1.4;display:block}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px}
.step .sn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex:none}
.step.run{background:var(--accent-soft)}
.step.run .sn{border-color:var(--accent)}
.step.done .sn{background:var(--c-gold);border-color:var(--c-gold);color:#fff}
.step.skip{opacity:.55}
.step .st{flex:1;min-width:0}
.step .st b{font-weight:500;display:block;font-size:13.5px}
.step .st span{font-size:11.5px;color:var(--muted)}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--c-gold);transition:width .25s}
.sum-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sum-list li{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-size:13px}
.sum-list li b{font-family:var(--f-serif);font-size:24px;font-weight:600;color:var(--accent);min-width:28px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:12.5px;color:var(--text2);line-height:1.5}
.notice svg{color:var(--accent);margin-top:1px}
.notice.warn{background:rgba(161,69,58,.06);border-color:rgba(161,69,58,.3)}
.notice.warn svg{color:var(--danger)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.two-col>*,.grid2>*,.grid3>*{min-width:0}
.slides-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.slide-card{flex:none;width:168px;display:flex;flex-direction:column;gap:6px}
.slide-card canvas{width:168px;height:210px;border-radius:8px;box-shadow:var(--shadow-1);background:#fff;display:block}
.alt-row{display:flex;gap:4px;overflow-x:auto}
.alt-row img{width:34px;height:34px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;flex:none}
.alt-row img.on{border-color:var(--c-gold)}
.variant{border:1px solid var(--line);border-radius:var(--r-l);padding:14px;margin-bottom:12px;background:var(--surface);transition:all .2s}
.variant.on{border-color:var(--c-gold);box-shadow:inset 0 0 0 1px var(--c-gold)}

/* media library */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);position:relative;cursor:pointer;transition:all .15s}
.mcard:hover{box-shadow:var(--shadow-2)}
.mcard.sel{outline:2.5px solid var(--c-gold);outline-offset:-1px}
.mcard .mth{aspect-ratio:1;background:var(--surface3);position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mcard .mth img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .mi{padding:7px 9px 9px}
.mcard .mn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mt{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;margin-top:4px}
.mcard .mt span{font-size:9.5px;padding:1px 6px;border-radius:8px;background:var(--surface3);color:var(--text2);white-space:nowrap}

.mcard .favb{position:absolute;top:6px;right:6px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(23,19,15,.45);border:0;color:#fff;display:flex;align-items:center;justify-content:center}

.mcard .dur{position:absolute;right:6px;bottom:6px;background:rgba(23,19,15,.7);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:42px}
.tab.on{color:var(--text);border-bottom-color:var(--c-gold)}
.tagchip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;background:var(--surface3);font-size:12px;border:1px solid transparent;min-height:30px}
.tagchip.ai{background:var(--accent-soft);border-color:var(--accent-line)}
.tagchip button{border:0;background:none;padding:0;color:var(--muted);display:flex}
.batchbar{position:sticky;bottom:12px;margin-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--c-black);color:var(--c-ivory);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow-3);z-index:5}
.batchbar .btn{background:transparent;color:var(--c-ivory);border-color:rgba(241,233,219,.25)}

/* brand kit */
.bk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bk-color{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.bk-color .bc{height:86px;position:relative}
.bk-color .bm{padding:8px 10px}
.bk-color .bm b{font-weight:500;font-size:13px;display:block}
.bk-color .bm span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bk-font{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.bk-font .sample{font-size:38px;line-height:1.1;margin:4px 0 6px}
.bk-asset{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.bk-asset .ba{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(var(--surface3) 0 25%,var(--surface) 0 50%) 0 0/16px 16px;position:relative}
.bk-asset .ba img{max-width:80%;max-height:80%;object-fit:contain}
.bk-asset .bm{padding:8px 10px;display:flex;align-items:center;gap:6px}
.style-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);text-align:left;padding:0;transition:all .15s}
.style-card:hover{border-color:var(--accent-line);box-shadow:var(--shadow-1)}
.style-card .sp{height:110px;display:flex;flex-direction:column;justify-content:center;padding:14px;gap:4px}
.style-card .sm{padding:9px 12px;font-size:12.5px;font-weight:500;border-top:1px solid var(--line)}

/* AI */
.ai-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ai-tool{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px;transition:all .15s;min-height:118px}
.ai-tool:hover{border-color:var(--accent-line);box-shadow:var(--shadow-1)}
.ai-tool.on{border-color:var(--c-gold);box-shadow:inset 0 0 0 1px var(--c-gold)}
.ai-tool b{font-weight:500;font-size:14px}
.ai-tool span{font-size:11.5px;color:var(--muted);line-height:1.45}
.ai-out{white-space:pre-wrap;line-height:1.65;font-size:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px}
.ai-out h6{margin:0 0 4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500}
.ai-out .blk{margin-bottom:14px}
.conn{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--line2)}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.conn.on .dot{background:var(--ok)}

/* command bar */
.cmdk{position:fixed;inset:0;z-index:8800;background:rgba(23,19,15,.38);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fadeIn .15s}
.cmdk-box{width:min(620px,100%);background:var(--surface);border-radius:18px;box-shadow:var(--shadow-3);overflow:hidden;border:1px solid var(--line);animation:fadeUp .2s var(--ease)}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{flex:1;border:0;background:transparent;font-size:16px;outline:none;min-height:30px}
.cmdk-list{max-height:min(56vh,440px);overflow-y:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;text-align:left;font-size:13.5px;min-height:44px}
.cmdk-item.on{background:var(--accent-soft)}
.cmdk-item .ck{margin-left:auto;font-size:11px;color:var(--muted)}
.cmdk-grp{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px}

/* preview mode */
body.preview-mode #nav,body.preview-mode #topbar,body.preview-mode #brand,body.preview-mode .toolrail,body.preview-mode .toolpanel,body.preview-mode .inspector,body.preview-mode .pages,body.preview-mode .stage-bar,body.preview-mode .timeline,body.preview-mode #bottomnav,body.preview-mode .mtoolbar{display:none!important}
body.preview-mode #app{grid-template-columns:1fr;grid-template-rows:1fr;grid-template-areas:"main"}
body.preview-mode .editor,body.preview-mode .veditor{grid-template-columns:1fr!important;grid-template-rows:1fr!important}
body.preview-mode .stagewrap,body.preview-mode .vtop{grid-column:1/-1!important;grid-row:1/-1!important}
body.preview-mode .vtop{grid-template-columns:1fr!important}
body.preview-mode .stage,body.preview-mode .vpreview{background:#0b0907}
body.preview-mode .selbox,body.preview-mode .guide,body.preview-mode .safezone,body.preview-mode .hoverbox{display:none!important}
#exit-preview{display:none;position:fixed;top:14px;right:14px;z-index:9000}
body.preview-mode #exit-preview{display:inline-flex}

/* mobile toolbar inside editors */
.mtoolbar{display:none}
.sheet-handle{display:none}

/* ── Tablet ────────────────────────────────────────────────────────────── */
@media (max-width:1180px){
  :root{--panel-w:270px;--insp-w:270px}
}
@media (max-width:1023px){
  .editor{grid-template-columns:62px 0 1fr 0}
  .editor .toolpanel{position:absolute;left:62px;top:0;bottom:0;width:300px;z-index:30;box-shadow:var(--shadow-3)}
  .editor .inspector{position:absolute;right:0;top:0;bottom:0;width:300px;z-index:30;box-shadow:var(--shadow-3);display:none}
  .editor.insp-open .inspector{display:block}
  .veditor{grid-template-columns:1fr 0}
  .veditor .vinspector{position:absolute;right:0;top:0;bottom:0;width:310px;z-index:30;box-shadow:var(--shadow-3);display:none}
  .veditor.insp-open .vinspector{display:block}
  .pages{grid-column:3/4}
  .feature-row{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .insp-toggle{display:inline-flex!important}
}
.insp-toggle{display:none!important}

  .qa-grid{grid-template-columns:repeat(2,1fr)}
  .proj-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .media-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .mcard .mi{display:none}
  .feature{min-height:150px;padding:20px}
  .feature .ft{font-size:24px}
  .modal{border-radius:22px 22px 0 0;width:100%;max-height:92vh;position:fixed;bottom:0;left:0;right:0;animation:sheetUp .3s var(--ease)}
  .overlay{padding:0;align-items:flex-end}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}

  /* design editor on phone: canvas top, tools bottom */
  .editor{display:flex;flex-direction:column;position:relative}
  .editor .toolrail{display:none}
  .editor .stagewrap{flex:1;min-height:0}
  .editor .pages{order:3;padding:6px 10px;gap:8px}
  .editor .pages .pg canvas{max-height:52px;width:auto!important}
  .editor .stage-bar{display:none}
  .editor .toolpanel,.editor .inspector,.veditor .vinspector{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;max-height:64vh;height:auto;z-index:60;border-radius:22px 22px 0 0;border:1px solid var(--line);box-shadow:var(--shadow-3);animation:sheetUp .28s var(--ease);padding-bottom:var(--safe-b)}
  .editor .toolpanel{display:flex}
  .editor.panel-closed .toolpanel{display:none}
  .editor .inspector{display:none}
  .editor.insp-open .inspector,.veditor.insp-open .vinspector{display:block}
  .sheet-handle{display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:8px auto 0}
  .mtoolbar{display:flex;order:4;gap:2px;overflow-x:auto;padding:4px 6px calc(4px + var(--safe-b));border-top:1px solid var(--line);background:var(--surface2);flex:none;-webkit-overflow-scrolling:touch}
  .mtoolbar .tool-btn{min-width:62px;flex:none;min-height:54px;font-size:10px}
  .veditor{display:flex;flex-direction:column}
  .vtop{display:flex;flex:1;min-height:0}
  .vtop .toolrail{display:none}
  .vpreview{flex:1}
  .vstage{padding:8px}
  .vcontrols{padding:4px 8px}
  .timeline{height:var(--tl-h-m,230px);min-height:150px}
  .tl-body{grid-template-columns:44px 1fr}
  .tl-label{padding:0 4px;justify-content:center}
  .tl-label .ln{display:none}
  .veditor .mtoolbar{order:5}
  .sec-h .btn .bl{display:none}
  .hero{margin-bottom:18px}
  .tb-group .ibtn{width:40px;height:40px}
  #tb-actions .btn .bl{display:none}
  #tb-actions .btn{padding:0 11px;min-height:40px}
  #tb-actions{gap:0}
  .grid3{grid-template-columns:1fr}
  .vcontrols .tc{min-width:0;font-size:11.5px}
  .vcontrols{gap:4px}
  .card{padding:14px}
  .layer .lname,.layer input{min-width:0}
}
@media (max-width:380px){
  .qa-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .qa{padding:13px;min-height:96px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ai-tool .badge{white-space:normal;letter-spacing:.06em;line-height:1.3}

const DB = {
  name: 'mindea-creative-studio', version: 1, db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB nicht verfügbar'));
      const r = indexedDB.open(this.name, this.version);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { this.db.close(); this.db = null; }; res(this.db); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Datenbank blockiert – bitte andere Mindéa-Tabs schließen.'));
    });
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      let result;
      const t = d.transaction(store, mode);
      const s = t.objectStore(store);
      const req = fn(s);
      if (req) req.onsuccess = () => { result = req.result; };
      t.oncomplete = () => res(result);
      t.onerror = () => rej(t.error || (req && req.error));
      t.onabort = () => rej(t.error || new Error('Transaktion abgebrochen'));
    });
  },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  put(store, val) { return this.tx(store, 'readwrite', s => s.put(val)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  async kvGet(k, fb) { try { const r = await this.get('kv', k); return r ? r.v : fb; } catch (e) { return fb; } },
  kvSet(k, v) { return this.put('kv', { k, v }); },
};

function videoDuration(p) {
  if (!p || !p.video) return 0;

  let d = lay.length ? lay[lay.length - 1].end : 0;
  for (const it of p.video.items) d = Math.max(d, it.start + it.dur);

/** Sequential (magnetic) layout of the main track, including overlapping transitions. */

  for (let i = 0; i < main.length; i++) {

    const dur = Math.max(0.05, (c.out - c.in) / (c.speed || 1));
    let td = 0;
    if (i > 0 && c.trans && c.trans.type !== 'none') td = Math.min(c.trans.dur, dur / 2, out[i - 1].dur / 2);
    const start = Math.max(0, t - td);
    out.push({ clip: c, idx: i, start, end: start + dur, dur, td });
    t = start + dur;
  }

}

const History = {

  snap() { const p = App.project; if (!p) return null; const { thumb, ...rest } = p; return JSON.stringify(rest); },
  reset() { this.stack = []; this.idx = -1; const s = this.snap(); if (s) { this.stack.push(s); this.idx = 0; } updateUndoButtons(); },
  commit(label) {
    if (!App.project) return;

    if (this.stack[this.idx] === s) return;
    this.stack = this.stack.slice(0, this.idx + 1);

  rank(queryTags, opts = {}) {

    const pool = this.list.filter(m => (m.kind === kind || (allowVideo && m.kind === 'video')) && !exclude.has(m.id) && m.brandRole !== 'logo' && m.brandRole !== 'icon' && m.brandRole !== 'watermark');

/* ── Local image analysis (no network): brightness, warmth, saturation,

  const pn = $('#proj-name');
  pn.addEventListener('change', () => { const v = pn.value.trim(); if (App.project && v) { App.project.name = v; commit('rename'); Projects.list(); } else updateTopbar(); });
  pn.addEventListener('keydown', e => { if (e.key === 'Enter') pn.blur(); });
}
App.ui = {};
function updateTopbar() {
  const p = App.project; const pn = $('#proj-name'), vl = $('#view-label');
  const showName = p && ['design', 'video', 'captions'].includes(App.view) && ((App.view === 'design') === (p.type !== 'video') || App.view === 'captions');

  if (p && document.activeElement !== pn) pn.value = p.name;
  vl.textContent = (NAV.find(n => n.k === App.view) || {}).l || '';
  if (App.ui.export) App.ui.export.style.display = showName ? '' : 'none';
  if (App.ui.preview) App.ui.preview.style.display = showName && App.view !== 'captions' ? '' : 'none';
  $('#save-status').style.display = p ? '' : 'none';
  updateUndoButtons();
}
function updateUndoButtons() { if (!App.ui.undo) return; App.ui.undo.disabled = !History.canUndo(); App.ui.redo.disabled = !History.canRedo(); }
function showView(name) {
  if (!Views[name]) return;
  const prev = App.view;
  if (prev !== name && Views[prev] && Views[prev].hide) Views[prev].hide();
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  App.view = name;
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.body.classList.toggle('in-editor', (name === 'design' && Design.active()) || (name === 'video' && VideoUI.active()));
  if (App.preview && name !== 'design' && name !== 'video') setPreview(false);
  updateTopbar();
  try { Views[name].show(); } catch (e) { console.error(e); toast(friendlyError(e), 'error'); }
  DB.kvSet('lastView', name).catch(() => { });
}
function setPreview(on) {
  App.preview = on; document.body.classList.toggle('preview-mode', on);
  if (on) { Design.select && App.view === 'design' && Design.endTextEdit(); toast('Vorschau-Modus · Esc zum Beenden', 'info', { duration: 1800 }); }
  setTimeout(() => { if (App.view === 'design') Design.layout(); if (App.view === 'video') VideoUI.layout(); }, 30);
}
$('#exit-preview') && $('#exit-preview').addEventListener('click', () => setPreview(false));

/* ── Command bar (⌘K) ────────────────────────────────────────────────── */
function commandList() {
  const L = [
    { g: 'Erstellen', l: 'Text hinzufügen', k: 'text überschrift', i: 'text', fn: () => { if (App.project && App.project.type !== 'video') { showView('design'); Design.addText('headline'); } else if (App.project && App.project.type === 'video') { showView('video'); VideoUI.addText(); } else createAndOpen({ type: 'design', formatKey: 'post45' }).then(() => Design.addText('headline')); } },
    { g: 'Erstellen', l: 'Reel erstellen', k: 'video instagram 9:16 neu', i: 'phone', fn: () => createAndOpen({ type: 'video', formatKey: 'reel', name: 'Instagram Reel' }) },
    { g: 'Erstellen', l: 'Auto Edit – Video automatisch bearbeiten', k: 'automatisch schnitt rohvideo', i: 'wand', fn: () => showView('autoedit') },
    { g: 'Erstellen', l: 'Karussell erstellen', k: 'carousel slides smart', i: 'carousel', fn: () => showView('carousel') },
    { g: 'Erstellen', l: 'Smart Creator', k: 'assistent wizard', i: 'wand', fn: () => smartCreator() },
    { g: 'Erstellen', l: 'Neuer Instagram Post (4:5)', k: 'design post', i: 'design', fn: () => createAndOpen({ type: 'design', formatKey: 'post45', name: 'Instagram Post' }) },
    { g: 'Erstellen', l: 'Neue Story (9:16)', k: 'design story', i: 'phone', fn: () => createAndOpen({ type: 'design', formatKey: 'story', name: 'Story' }) },
    { g: 'Erstellen', l: 'Neue Präsentation (16:9)', k: 'slides deck', i: 'present', fn: () => createAndOpen({ type: 'design', formatKey: 'present', name: 'Präsentation', pagesCount: 3 }) },
    { g: 'Projekt', l: 'Exportieren', k: 'export download png jpg mp4', i: 'download', fn: () => openExport() },
    { g: 'Projekt', l: 'Untertitel / Caption Studio', k: 'captions untertitel', i: 'captions', fn: () => showView('captions') },
    { g: 'Projekt', l: 'Magic Resize', k: 'format größe ändern', i: 'resize', fn: () => magicResizeDialog() },
    { g: 'Projekt', l: 'Karussell als Reel animieren', k: 'carousel reel video', i: 'video', fn: () => carouselToReel(App.project) },
    { g: 'Projekt', l: 'Vorschau-Modus', k: 'preview präsentieren', i: 'eye', fn: () => setPreview(true) },
    { g: 'Projekt', l: 'Rückgängig', k: 'undo', i: 'undo', fn: () => History.undo() }, { g: 'Projekt', l: 'Wiederholen', k: 'redo', i: 'redo', fn: () => History.redo() },
    { g: 'Navigation', l: 'Brand Kit', k: 'farben schriften logo', i: 'brand', fn: () => showView('brand') },
    { g: 'Navigation', l: 'Medien hochladen', k: 'upload import mediathek', i: 'upload', fn: async () => { showView('media'); await Media.import(await pickFiles('image/*,video/*,audio/*', true)); } },
    { g: 'Navigation', l: 'Vorlagen', k: 'templates', i: 'templates', fn: () => showView('templates') },
    { g: 'Navigation', l: 'KI Studio', k: 'ai caption hook script', i: 'ai', fn: () => showView('ai') },
    { g: 'Navigation', l: 'Start', k: 'dashboard home', i: 'home', fn: () => showView('start') },
    { g: 'Darstellung', l: 'Hell', k: 'theme light', i: 'sun', fn: () => setTheme('light') }, { g: 'Darstellung', l: 'Dunkel', k: 'theme dark', i: 'moon', fn: () => setTheme('dark') }, { g: 'Darstellung', l: 'System', k: 'theme auto', i: 'monitor', fn: () => setTheme('system') },
  ];
  Projects.cache.slice(0, 40).forEach(p => L.push({ g: 'Projekt öffnen', l: p.name, k: 'öffnen ' + (TYPE_LABEL[p.type] || '') + ' ' + fmtRel(p.updatedAt), i: p.type === 'video' ? 'video' : 'design', fn: () => Projects.open(p.id, p.type === 'video' ? 'video' : 'design'), sub: fmtRel(p.updatedAt) }));
  return L;
}
function openCommandBar() {
  if ($('.cmdk')) return;
  const all = commandList(); let idx = 0, list = all;
  const inp = h('input', { placeholder: 'Befehl oder Projekt suchen …', 'aria-label': 'Befehl suchen', autocomplete: 'off' });
  const box = h('div', { class: 'cmdk-list', role: 'listbox' });
  const ov = h('div', { class: 'cmdk', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Befehlsleiste' }, h('div', { class: 'cmdk-box' }, h('div', { class: 'cmdk-in' }, iconEl('search'), inp, h('span', { class: 'kbd' }, 'Esc')), box));
  const close = () => ov.remove();
  const run = it => { close(); setTimeout(() => it.fn(), 10); };
  const draw = () => {
    clear(box); let g = '';
    if (!list.length) box.appendChild(h('div', { class: 'cmdk-grp' }, 'Keine Treffer'));
    list.slice(0, 60).forEach((it, i) => { if (it.g !== g) { g = it.g; box.appendChild(h('div', { class: 'cmdk-grp' }, g)); } const b = h('button', { class: 'cmdk-item' + (i === idx ? ' on' : ''), type: 'button', role: 'option', 'aria-selected': i === idx, onclick: () => run(it), onmousemove: () => { if (idx !== i) { idx = i; draw(); } } }); b.innerHTML = icon(it.i, 's') + `<span>${escapeHtml(it.l)}</span>` + (it.sub ? `<span class="ck">${escapeHtml(it.sub)}</span>` : ''); box.appendChild(b); });
    box.querySelector('.cmdk-item.on')?.scrollIntoView({ block: 'nearest' });
  };
  inp.addEventListener('input', () => { const q = inp.value.trim().toLowerCase().normalize('NFC'); list = !q ? all : all.filter(it => (it.l + ' ' + it.k + ' ' + it.g).toLowerCase().includes(q) || q.split(' ').every(w => (it.l + ' ' + it.k).toLowerCase().includes(w))); idx = 0; draw(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(list.length - 1, idx + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (list[idx]) run(list[idx]); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  ov.addEventListener('pointerdown', e => { if (e.target === ov) close(); });
  document.body.appendChild(ov); draw(); setTimeout(() => inp.focus(), 20);
}

/* ── Global shortcuts ────────────────────────────────────────────────── */
function isTyping(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && k.toLowerCase() === 'k') { e.preventDefault(); openCommandBar(); return; }
  if (mod && k.toLowerCase() === 's') { e.preventDefault(); saveNow().then(() => toast('Gespeichert · lokal', 'success', { duration: 1200 })); return; }
  if (k === 'Escape') {
    if ($('.menu')) { $$('.menu').forEach(m => m.remove()); return; }
    const top = ModalStack[ModalStack.length - 1]; if (top) { if (top.closable) top.close(); return; }
    if (App.preview) { setPreview(false); return; }
  }
  if (ModalStack.length || $('.cmdk')) return;
  if (isTyping(e)) return;
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? History.redo() : History.undo(); return; }
  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); History.redo(); return; }
  if (k === ' ' && ['video', 'captions'].includes(App.view) || (k === ' ' && App.view === 'autoedit' && VE.override)) { e.preventDefault(); VE.toggle(); return; }
  if (!mod && k.toLowerCase() === 'p' && (App.view === 'design' || App.view === 'video') && App.project) { setPreview(!App.preview); return; }
  const v = Views[App.view];
  if (v && v.onKey && v.onKey(e)) e.preventDefault();
});

/* ── Error safety: never show stack traces to the user ───────────────── */
let _lastErr = 0;
function reportError(e) { console.error(e); if (Date.now() - _lastErr < 4000) return; _lastErr = Date.now(); toast(friendlyError(e && (e.reason || e.error || e)), 'error'); }
window.addEventListener('error', e => { if (e.message && /ResizeObserver/.test(e.message)) return; reportError(e.error || e.message); });
window.addEventListener('unhandledrejection', e => reportError(e.reason));

  buildNav(); buildTopbar();
  let dbOk = true;

  StartUI.mount($('#view-start')); Design.mount($('#view-design')); VideoUI.mount($('#view-video')); AutoEditUI.mount($('#view-autoedit')); CaptionsUI.mount($('#view-captions'));
  CarouselUI.mount($('#view-carousel')); MediaUI.mount($('#view-media')); TemplatesUI.mount($('#view-templates')); BrandUI.mount($('#view-brand')); AIUI.mount($('#view-ai'));
  requestPersistentStorage();

  if (document.fonts) Promise.all(['500 40px "Cormorant Garamond"', 'italic 500 40px "Cormorant Garamond"', '600 40px "Cormorant Garamond"', '400 40px "Jost"', '300 40px "Jost"', '500 40px "Jost"', '700 40px "Jost"', '500 40px "Playfair Display"', 'italic 500 40px "Playfair Display"'].map(f => document.fonts.load(f).catch(() => { }))).then(() => { _tplThumbCache.clear(); requestRender(); requestVRender(); if (App.view === 'templates') TemplatesUI.render(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(true); });
  window.addEventListener('pagehide', () => saveNow(true));
  window.addEventListener('beforeunload', () => { saveNow(true); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (App.view === 'video') Timeline.drawRuler(); });
}
init();
